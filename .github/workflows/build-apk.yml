name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo (core)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain 2>&1 | tee test.log

      - name: Compilar APKs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Separar APKs
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/OrbitFiles-1.0.0.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk out/OrbitFiles-1.0.0-debug.apk 2>/dev/null || true
          cp test.log build.log out/ 2>/dev/null || true
          echo "tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }} sha=${{ github.sha }} run=${{ github.run_number }}" > out/STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OrbitFiles-APK
          path: out/

      # Publica APKs e logs na branch "build-output" (fácil de baixar sem login no Actions).
      - name: Publicar na branch build-output
        if: always()
        run: |
          cd out
          git init -q -b build-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }} (${{ steps.build.outcome }})"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output

      - name: Falhar se algo deu errado
        if: steps.build.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
